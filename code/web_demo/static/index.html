    <link rel="stylesheet" href="/static/styles.css">
</head>

    <nav class="uk-navbar-container uk-navbar-transparent uk-container uk-light" data-uk-navbar="mode: click">

                </li>
            </ul>
        </div>
    </nav>
</div>

<div data-uk-height-viewport="expand: true">
<nav class="uk-container">
<ul class="uk-breadcrumb">
<li><a href="https://webis.de">Webis.de</a></li>
<li><a href="https://webis.de/research.html">Research</a></li>
<li><a href="#">Causal Graph Inference</a></li>
<li class="uk-disabled"><a href="#">Demo</a></li>
</ul>
</nav>

<script type="application/ld+json">
{
    "@context":"http://schema.org/",
    "@type":"Demo",
    "name":"Causal Graph Inference",
    "description":"Interactive inference demo for causal knowledge graphs.",
    "url":"http://127.0.0.1:8000/",
    "keywords":["causal graph", "BFS", "reinforcement learning", "A*", "inference", "Webis"],
    "creator":[
        {
            "@type":"Organization",
            "url":"https://webis.de/",
            "name":"The Web Technology & Information Systems Network",
            "alternateName":"Webis"
        }
    ]
}
</script>

<main class="uk-section uk-section-default demo-main">
    <div class="uk-container">
        <h1>Causal Graph Inference</h1>

        <div id="alert" class="demo-alert" hidden></div>

        <section class="demo-layout" aria-label="Causal graph inference demo">
            <aside class="demo-panel controls-panel">
                <form id="controls" class="uk-form-stacked">
                    <div class="uk-margin-small-bottom">
                        <label class="uk-form-label" for="graph-select">Causal Graph</label>
                        <select id="graph-select" class="uk-select"></select>
                        <div id="graph-size" class="advanced-note"></div>
                    </div>

                    <div class="uk-margin-small-bottom">
                        <label class="uk-form-label" for="method-select">Search Method</label>
                        <select id="method-select" class="uk-select"></select>
                        <div id="method-validation" class="advanced-note"></div>
                    </div>

                    <div id="astar-dimension-control" class="uk-margin-small-bottom" hidden>
                        <label class="uk-form-label" for="astar-dimension-select">Dimension</label>
                        <select id="astar-dimension-select" class="uk-select"></select>
                    </div>

                    <div class="uk-margin-small-bottom">
                        <label class="uk-form-label" for="source-input">Cause Concept</label>
                        <input id="source-input" class="uk-input" list="source-suggestions" autocomplete="off">
                        <datalist id="source-suggestions"></datalist>
                    </div>

                    <div class="uk-margin-small-bottom">
                        <label class="uk-form-label" for="target-input">Effect Concept</label>
                        <input id="target-input" class="uk-input" list="target-suggestions" autocomplete="off">
                        <datalist id="target-suggestions"></datalist>
                    </div>

                    <div class="pick-mode" role="group" aria-label="Node click target">
                        <button type="button" class="uk-button uk-button-default pick-button active" id="pick-source">
                            <span data-uk-icon="icon: location; ratio: 0.85"></span>
                            Cause
                        </button>
                        <button type="button" class="uk-button uk-button-default pick-button" id="pick-target">
                            <span data-uk-icon="icon: future; ratio: 0.85"></span>
                            Effect
                        </button>
                    </div>

                    <details class="advanced-settings">
                        <summary>Advanced settings</summary>
                        <div id="bfs-settings" class="method-settings" hidden>
                            <div class="uk-margin-small-top">
                                <label class="uk-form-label" for="bfs-search-cap">Search cap</label>
                                <input id="bfs-search-cap" class="uk-input" type="number" min="-1" step="1">
                                <div id="bfs-cap-mode" class="advanced-note"></div>
                                <div id="bfs-cap-source" class="advanced-note"></div>
                            </div>
                        </div>
                        <div id="rl-settings" class="method-settings" hidden>
                            <dl id="rl-details" class="config-details"></dl>
                        </div>
                        <div id="astar-settings" class="method-settings" hidden>
                            <dl id="astar-details" class="config-details"></dl>
                            <div class="uk-margin-small-top">
                            <label class="uk-form-label" for="astar-max-visits">A* Max Visits</label>
                            <input id="astar-max-visits" class="uk-input" type="number" min="-1" step="1">
                            <div id="astar-max-visits-source" class="advanced-note"></div>
                            </div>
                            <div class="uk-margin-small-top">
                                <label class="uk-form-label" for="embedding-threshold">Embedding-Index Threshold</label>
                                <input id="embedding-threshold" class="uk-input" type="number" min="1" step="1">
                            </div>
                        </div>
                    </details>

                    <button id="run-button" type="submit" class="uk-button uk-button-primary run-button">
                        <span data-uk-icon="icon: play; ratio: 0.85"></span>
                        Run Inference
                    </button>
                </form>

                <div class="result-panel">
                    <div class="result-heading">
                        <h2>Result</h2>
                        <span>Search summary</span>
                    </div>
                    <div id="result-status" class="result-status idle" aria-live="polite">Ready</div>
                    <dl class="metrics">
                        <div><dt>Hops</dt><dd id="metric-hops">-</dd></div>
                        <div><dt>Visited</dt><dd id="metric-visited">-</dd></div>
                        <div><dt>Runtime</dt><dd id="metric-runtime">-</dd></div>
                    </dl>
                    <ol id="path-list" class="path-list"></ol>
                </div>
            </aside>

            <section class="graph-panel">
                <div class="graph-toolbar">
                    <span id="graph-caption">Loading graph sample...</span>
                    <button id="reload-subgraph" class="uk-button uk-button-default uk-button-small" type="button" title="Reload sampled graph">
                        <span data-uk-icon="icon: refresh; ratio: 0.8"></span>
                    </button>
                </div>
                <div id="graph"></div>
            </section>
        </section>
    </div>
</main>

</div>

              <a href="https://webis.de/people.html">Contact</a> <span class="uk-padding-small">&bullet;</span>
              <a href="https://webis.de/legal.html">Impressum / Terms / Privacy</a>
            </div>
        </div>
    </div>
</footer>

</body>
</html>
